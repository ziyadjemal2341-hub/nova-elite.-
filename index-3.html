mods:[
L("1. ስለ Vone App ምንነት (About Vone App)","1. Waa’ee Appilikeeshinii Vone (About Vone App)",

"<div class='g two'><div class='b'><h5>🪙 Coin (Saantima)</h5>Daawwattoonni maallaqa qabatamaan bitatanii hoostotaaf kennaa (gift) godhanii kan erganiifi geemii taphachuuf kan ooludha.</div><div class='b'><h5 style='color:#34d399'>💎 Point (Qabxii)</h5>Hoostonni kennaa fi hojiiwwan irraa kan argataniifi gara maallaqa qabatamaatti (Doolaara / Birrii) kan jijjiiramudha.</div></div>"),
L("4. የገቢ ምንጮች (Sources of Income)","4. Maddoota Galii (Sources of Income)",
"በ Vone ላይ ገቢ በሁለት ዋና ዋና ክፍሎች ይከፈላል፦<div class='g'><div class='b' style='border-left:4px solid #f59e0b'><h5>🔥 ትላልቅ ገቢ (4 Fields)፦</h5><ul style='list-style:none;padding:0'><li style='margin:.6rem 0'><strong>1) ኤጀንት / ኤጀንሲ (Agent / Agency)</strong><br><em>ምንነቱ፦</em> የራስዎን የሆስቶች ቡድን (Team) በመገንባትና በማስተዳደር የሚገኝ ተገብሮ ገቢ (Passive Income) ነው።<br><em>የገቢ መንገድ፦</em> በእርስዎ ሥር የተመዘገቡ ሆስቶች የቀጥታ ስርጭት (Live) ሠርተው ከሚያገኙት ነጥብ (Points) ላይ መድረኩ የተወሰነ የኮሚሽን ፐርሰንት ይከፍልዎታል።<br><em>ጥቅሙ፦</em> እርስዎ በቀጥታ ስርጭት ላይ ባይቀመጡም እንኳን፣ የቡድንዎ አባላት በሚሠሩበት ጊዜ የማያቋርጥ ገቢ ያስገኛል።</li><li style='margin:.6rem 0'><strong>2) የግብዣ ሂደት (Invitation / Referral)</strong><br><em>ምንነቱ፦</em> አዳዲስ ተጠቃሚዎችን እና ሆስቶችን በግል መጋበዣ ሊንክዎ (Referral Link) ወደ መተግበሪያው እንዲገቡ በማድረግ የሚገኝ ገቢ ነው።<br><em>የገቢ መንገድ፦</em> የተጋበዙት አዳዲስ አባላት መተግበሪያውን ተቀላቅለው የመለያ ማረጋገጫ (Verification) ሲያጠናቅቁና የመጀመሪያ ሥራቸውን ሲጀምሩ መድረኩ የአንድ ጊዜ ወይም ቀጣይነት ያለው የቦነስ ክፍያ ይሰጣል።<br><em>ጥቅሙ፦</em> የኤጀንሲዎን አውታረ መረብ በፍጥነት ለማስፋፋትና ፈጣን ጉርሻ ለማግኘት ያስችላል።</li><li style='margin:.6rem 0'><strong>3) የኮይን ሻጭ (Coinseller)</strong><br><em>ምንነቱ፦</em> በመተግበሪያው ውስጥ የሚገበያዩትን ሳንቲሞች (Coins) በጅምላ ከኩባንያው በመግዛት ለተጠቃሚዎች እና ለሆስቶች በችርቻሮ መሸጥ ነው።<br><em>የገቢ መንገድ፦</em> በጅምላ ግዢና በሽያጭ ዋጋ መካከል ባለው ልዩነት (Profit Margin) የሚገኝ ንጹህ ትርፍ ነው።<br><em>ጥቅሙ፦</em> ከፍተኛ የተጠቃሚዎች ቁጥር ባለበት ገበያ ውስጥ ተዓማኒነትን በመፍጠር በየቀኑ ፈጣን የጥሬ ገንዘብ ዝውውር ያስገኛል።</li><li style='margin:.6rem 0'><strong>4) የመሰረታዊ ደሞዝ ሆስት (Base Salary Host)</strong><br><em>ምንነቱ፦</em> በየቀኑ የተወሰነውን የሥራ ሰዓት (Daily Live Hours) እና የተሰጡትን ግቦች (Targets) የሚያሟሉ ብቁ ሆስቶች የሚያገኙት ዋስትና ያለው ቋሚ ወይም መሰረታዊ ክፍያ ነው።<br><em>የገቢ መንገድ፦</em> የመተግበሪያውን የቀንና የወር የሥራ መስፈርቶች (ለምሳሌ፡ በየቀኑ 2 ሰዓትና ከዚያ በላይ መቆየት) በማጠናቀቅ የሚገኝ ቀጥተኛ ክፍያ ነው።<br><em>ጥቅሙ፦</em> ከስጦታዎች በተጨማሪ ቋሚ የገንዘብ ዋስትና እንዲኖር ያደርጋል።</li><li style='margin:.6rem 0'><strong>5) የቪዲዮ ፈጣሪ (Video Creator)</strong><br><em>ምንነቱ፦</em> በመተግበሪያው ውስጥ ማራኪ እና ጥራት ያላቸው አጫጭር ቪዲዮዎችን (Short Videos/Reels) በመልቀቅ የሚገኝ ገቢ ነው።<br><em>የገቢ መንገድ፦</em> ቪዲዮዎች በሚያገኙት የእይታ ብዛት (Views)፣ የተጠቃሚዎች መስተጋብር (Engagement) እና ከተመልካቾች በሚላኩ የቪዲዮ ስጦታዎች የሚሰበሰብ ነጥብ ነው።<br><em>ጥቅሙ፦</em> የቀጥታ ስርጭት ላይ ባልሆኑበት ሰዓት ተጨማሪ ተከታዮችን ለመሳብና ከተከታታይ እይታዎች ተጓዳኝ ገቢ ለማመንጨት ይረዳል።</li></ul></div><div class='b' style='border-left:4px solid #0ea5e9'><h5 style='color:#38bdf8'>⚡ ትንአሽ ገቢ (Daily Tasks)፦</h5><strong style='color:#f9a8d4'>👩 የሴቶች ዕለታዊ ተግባራት (Female Tasks)</strong><ul style='list-style:none;padding:0'><li style='margin:.6rem 0'><strong>1) የቀጥታ ስርጭት (Live Streaming — በየቀኑ ከ1–2 ሰዓት)</strong><br><em>ተግባር፦</em> የራስን የቀጥታ ስርጭት (Live Room) ከፍቶ በቀን ቢያንስ ለ1 እስከ 2 ሰዓት መቆየት።<br><em>ዓላማና ጥቅም፦</em> የመተግበሪያው መሰረታዊ የቀን ገቢ መመዘኛ ሲሆን፣ አዳዲስ ተመልካቾችን ለመሳብ እና ስጦታዎችን (Gifts) በቀጥታ ለመሰብሰብ ዋነኛው መንገድ ነው።</li><li style='margin:.6rem 0'><strong>2) የፓርቲ መቀመጫ (Party Time Crown Seat — በቀን 1 ሰዓት)</strong><br><em>ተግባር፦</em> በሌሎች ተጠቃሚዎች ወይም በኤጀንሲው የፓርቲ ሩም (Party Room) ውስጥ ባለው የክብር መቀመጫ (Crown Seat) ላይ በቀን ለ1 ሰዓት መሳተፍ።<br><em>ዓላማና ጥቅም፦</em> ከቡድን አባላት ጋር መስተጋብር ለመፍጠር፣ የመተግበሪያውን ዕለታዊ የቦነስ ነጥብ ለማሟላት እና በጋራ ድጋፍ ተጨማሪ ገቢ ለማግኘት ያስችላል።</li><li style='margin:.6rem 0'><strong>3) የሣጥን ስጦታ መሰብሰብ (Treasure Box Collect — በቀን 10 ጊዜ)</strong><br><em>ተግባር፦</em> በቀጥታ ስርጭት ክፍሎች ውስጥ ተጠቃሚዎች የሚያስቀምጧቸውን ወይም የሚወድቁትን የሣጥን ስጦታዎች (Treasure Boxes) በቀን 10 ጊዜ መክፈትና ማሰባሰብ።<br><em>ዓላማና ጥቅም፦</em> ያለ ምንም ወጪ ነፃ ሳንቲሞችን (Coins) እና ነጥቦችን ለመሰብሰብ እንዲሁም የቀን ተግባር ቦነስን ሙሉ ለማድረግ ይረዳል።</li></ul><strong style='color:#7dd3fc'>👨 የወንዶች ዕለታዊ ተግባራት (Male Tasks)</strong><ul style='list-style:none;padding:0'><li style='margin:.6rem 0'><strong>1) በማይክ ላይ መሳተፍ (On Mic Task — በቀን 1 ሰዓት)</strong><br><em>ተግባር፦</em> በፓርቲ ክፍሎች ወይም በቀጥታ ስርጭቶች ላይ ማይክ ይዞ (On-Mic Seat) በቀን ለ1 ሰዓት መሳተፍ እና ማውራት።<br><em>ዓላማና ጥቅም፦</em> ወንዶች አብዛኛውን ጊዜ የራሳቸውን ረጅም የቀጥታ ስርጭት ከማድረግ ይልቅ በፓርቲ ክፍሎች በማይክ በመሳተፍ፣ ከሌሎች ጋር ውይይት በማድረግና ድባብ በመፍጠር ዕለታዊ የሥራ ነጥባቸውን የሚያሟሉበት ቀላል መንገድ ነው።</li><li style='margin:.6rem 0'><strong>2) የሣጥን ስጦታ መሰብሰብ (Treasure Box Collect — በቀን 10 ጊዜ)</strong><br><em>ተግባር፦</em> በተለያዩ ክፍሎች የሚጣሉትን የሣጥን ስጦታዎች (Treasure Boxes) በቀን 10 ጊዜ መክፈትና ማሰባሰብ።<br><em>ዓላማና ጥቅም፦</em> ዕለታዊ እንቅስቃሴን በመጠበቅ ተጨማሪ ነፃ ነጥቦችንና ሳንቲሞችን ለማግኘት ያስችላል።</li></ul><strong>💡 የልዩነቱ ዋና ነጥብ (Key Takeaway)</strong><ul><li><strong>ለሴቶች፦</strong> ትኩረቱ በራስ የቀጥታ ስርጭት (Live Room) እና በፓርቲ የክብር ወንበር (Crown Seat) ላይ ተቀምጦ ተመልካቾችን በማስተናገድ ላይ ነው።</li><li><strong>ለወንዶች፦</strong> ረጅም ሰዓት በብቻ ላይቭ ከመቀመጥ ይልቅ በፓርቲ ክፍሎች ማይክ በመያዝ (On-Mic) ንቁ ተሳትፎ ማድረግንና የሣጥን ስጦታዎችን ማሰባሰብን እንደ ዋና የቀን ገቢ መመዘኛ ያደርጋል።</li></ul></div></div>",
"Galiin Vone keessatti bakka gurguddoo lamatti qoodama:<div class='g'><div class='b' style='border-left:4px solid #f59e0b'><h5>🔥 Galii Gurguddaa (4 Fields):</h5><ul style='list-style:none;padding:0'><li style='margin:.6rem 0'><strong>1) Eejantii / Eejansii (Agent / Agency)</strong><br><em>Maal:</em> Garee hoostotaa mataa keessanii ijaaruun fi geggeessuun galii walirraa hin cinne (Passive Income) argachuudha.<br><em>Karaa galii:</em> Hoostonni isin jalatti galmaa’an tamsaasa kallattii (Live) hojjetanii qabxii argatan irraa waltajjiin komishinii dhibbeentaa murtaa’e isiniif kaffala.<br><em>Faayidaa:</em> Isin live osoo hin ta’in iyyuu, miseensonni gareetii yeroo hojjetan galii hin dhaabbanne argattu.</li><li style='margin:.6rem 0'><strong>2) Adeemsa Affeerraa (Invitation / Referral)</strong><br><em>Maal:</em> Fayyadamtoota fi hoostota haaraa liinkii affeerraa (Referral Link) keessaniin gara appilikeeshinii seensisuun galii argachuudha.<br><em>Karaa galii:</em> Miseensonni affeeraman yeroo galmaa’anii mirkaneessuu (Verification) xumuranii hojii jalqabaa jalqaban, waltajjiin boonasii al tokko ykn itti fufiinsa qabu kenna.<br><em>Faayidaa:</em> Neetworkii eejansii keessanii saffisaan balleessuu fi boonasii ariifataa argachuuf isin gargaara.</li><li style='margin:.6rem 0'><strong>3) Gurguraa Saantimaa (Coinseller)</strong><br><em>Maal:</em> Saantima (Coins) appilikeeshinii keessatti daldalaman kampanii irraa heddumminaan bitanii fayyadamtootaa fi hoostotaaf xixiqqeessanii gurguruudha.<br><em>Karaa galii:</em> Garaagarummaa gatii bitaa fi gurgaa jidduu jiru (Profit Margin) irraa bu’aa qulqulluu argachuudha.<br><em>Faayidaa:</em> Gabaa fayyadamtoonni baay’een jiran keessatti amanamummaa uumuun guyyaa guyyaan sochii maallaqaa ariifataa argamsiisa.</li><li style='margin:.6rem 0'><strong>4) Hoostii Mindaa Bu’uuraa (Base Salary Host)</strong><br><em>Maal:</em> Hoostonni sa’aatii hojii guyyaa (Daily Live Hours) fi galmoota (Targets) kennaman guuttatan kaffaltii mirkanaa’aa ykn bu’uuraa argatanidha.<br><em>Karaa galii:</em> Ulaagaa hojii guyyaa fi ji’aa (fkn: guyyaatti sa’aatii 2 fi isaa ol live ta’uu) raawwachuun kaffaltii kallattii argamudha.<br><em>Faayidaa:</em> Kennaa irra dabalataan mirkaneessa maallaqaa dhaabbataa akka jiraatu godha.</li><li style='margin:.6rem 0'><strong>5) Uumaa Viidiyoo (Video Creator)</strong><br><em>Maal:</em> Appilikeeshinii keessatti viidiyoowwan gabaabaa (Short Videos/Reels) dinqisiisaa fi qulqullina qabanii maxxansuun galii argachuudha.<br><em>Karaa galii:</em> Baay’ina ilaalcha (Views), hirmaannaa fayyadamtootaa (Engagement) fi kennaa viidiyoo daawwattoota irraa ergamu irraa qabxii walitti qabamuudha.<br><em>Faayidaa:</em> Yeroo live hin taane hordoftoota dabalataa harkisuu fi ilaalcha itti fufiinsa qabu irraa galii dabalataa argachuuf gargaara.</li></ul></div><div class='b' style='border-left:4px solid #0ea5e9'><h5 style='color:#38bdf8'>⚡ Galii Xixiqqaa (Daily Tasks):</h5><strong style='color:#f9a8d4'>👩 Hojiiwwan Guyyaa Dubartootaa (Female Tasks)</strong><ul style='list-style:none;padding:0'><li style='margin:.6rem 0'><strong>1) Tamsaasa Kallattii (Live Streaming — guyyaa guyyaan sa’aatii 1–2)</strong><br><em>Hojii:</em> Live Room mataa keessanii banuun guyyaatti yoo xiqqaate sa’aatii 1 hanga 2 turuu.<br><em>Kaayyoo fi faayidaa:</em> Ulaagaa galii guyyaa bu’uuraa appilikeeshinii yoo ta’u, daawwattoota haaraa harkisuu fi kennaa (Gifts) kallattiin walitti qabuuf karaa ijoodha.</li><li style='margin:.6rem 0'><strong>2) Teessoo Party (Party Time Crown Seat — guyyaatti sa’aatii 1)</strong><br><em>Hojii:</em> Party Room fayyadamtoota biroo ykn eejansii keessa jiru keessatti teessoo ulfinaa (Crown Seat) irratti guyyaatti sa’aatii 1 hirmaachuu.<br><em>Kaayyoo fi faayidaa:</em> Miseensota gareetii wajjin walitti dhufeenya uumuu, qabxii boonasii guyyaa guuttachuu fi deggersa waliinii wajjin galii dabalataa argachuuf isin dandeessisa.</li><li style='margin:.6rem 0'><strong>3) Kennaa Kuusaa Walitti Qabuu (Treasure Box Collect — guyyaatti altokko 10)</strong><br><em>Hojii:</em> Kennaa Treasure Box fayyadamtoonni live room keessa kaa’an ykn gadi bu’an guyyaatti altokko 10 banuun walitti qabuu.<br><em>Kaayyoo fi faayidaa:</em> Kaffaltii malee saantima (Coins) fi qabxii bilisaa walitti qabuu fi boonasii hojii guyyaa guutuuf gargaara.</li></ul><strong style='color:#7dd3fc'>👨 Hojiiwwan Guyyaa Dhiirotaa (Male Tasks)</strong><ul style='list-style:none;padding:0'><li style='margin:.6rem 0'><strong>1) Maayikii Irratti Hirmaachuu (On Mic Task — guyyaatti sa’aatii 1)</strong><br><em>Hojii:</em> Party room ykn tamsaasa kallattii irratti maayikii qabuun (On-Mic Seat) guyyaatti sa’aatii 1 hirmaachuu fi dubbachuu.<br><em>Kaayyoo fi faayidaa:</em> Dhiironni yeroo baay’ee tamsaasa dheeraa mataa isaanii gochuu irra, party room keessatti maayikiin hirmaachuun, namoota biroo wajjin marii gochuu fi haala gammachiisaa uumuun qabxii hojii guyyaa guuttachuu kan danda’aniidha.</li><li style='margin:.6rem 0'><strong>2) Kennaa Kuusaa Walitti Qabuu (Treasure Box Collect — guyyaatti altokko 10)</strong><br><em>Hojii:</em> Kennaa Treasure Box live room garagaraa keessatti darbataman guyyaatti altokko 10 banuun walitti qabuu.<br><em>Kaayyoo fi faayidaa:</em> Sochii guyyaa eeggachuun qabxii fi saantima bilisaa dabalataa argachuuf isin dandeessisa.</li></ul><strong>💡 Qabxii Ijoo Garaagarummaa (Key Takeaway)</strong><ul><li><strong>Dubartootaaf:</strong> Xiyyeeffannoon Live Room mataa isaanii fi teessoo ulfinaa Party (Crown Seat) irra teessanii daawwattoota simachuu irratti.</li><li><strong>Dhiirotaaf:</strong> Live dheeraa kophaa ta’uu irra, party room keessatti maayikii qabuun (On-Mic) hirmaachuu fi kennaa saanduqaa walitti qabuu ulaagaa galii guyyaa ijoo godha.</li></ul></div></div>")]},
{day:2,icon:"📚",pa:"ደረጃዎች (Levels) እና የግብዣ (Invitation) ሂደት",po:"Sadarkaalee (Levels) fi Adeemsa Affeerraa (Invitation)",
pts:["👉 ስለ ደረጃዎች(Levels)","🎯 (Invitation) ሂደት","ለአዲስ ሆስት 2 ዓይነት ደረጃዎች አሉ","🔥 የሃብት ደረጃ (Wealth level) እና","🔥 የቀጥታ ስርጭት ደረጃ (Live stream level)"],
mods:[
L("1. ስለ ደረጃዎች (Understanding Levels)","1. Waa’ee Sadarkaalee Hubachuu",
"በ Vone መተግበሪያ ላይ ደረጃ (Level) ማለት የእርስዎን ተዓማኒነት፣ ልምድ እና ተደራሽነት የሚለካ መለኪያ ነው። ደረጃዎ ከፍ ባለ ቁጥር በመተግበሪያው የመነሻ ገጽ (Discovery Page) ላይ በቅድሚያ ትታያላችሁ፤ ይህም ብዙ አዳዲስ ተመልካቾችንና ስጦታዎችን በቀላሉ እንድታገኙ ያግዛል።",
"Vone keessatti sadarkaan (Level) dandeettii, amanamummaa fi beekamtii keessan agarsiisa. Sadarkaan keessan yoo dabalu, fuula duraa (homepage) irratti durfamanii mul’attu; kunis daawwattoota baay’ee fi kennaa hedduu akka argattan isin gargaara."),
L("2. ለአዲስ ሆስት 2 ዓይነት ደረጃዎች (Two Key Host Levels)","2. Hoostii Haaraaf Sadarkaalee Gosa 2",
"እያንዳንዱ ሆስት ሊረዳቸው የሚገቡ ሁለት ወሳኝ ደረጃዎች አሉ፦<div class='g'><div class='b'><h5>👑 የሃብት ደረጃ (Wealth Level)</h5>ይህ ደረጃ የሚወሰነው እርስዎ በሚያወጡት (በሚገዙትና ለሌሎች በሚልኩት) የኮይን መጠን ነው። የሃብት ደረጃዎ ከፍ ሲል በመተግበሪያው ላይ ልዩ ባጆች፣ የመግቢያ አኒሜሽኖች እና የክብር ምልክቶች ይሰጡዎታል።</div><div class='b'><h5>📡 የቀጥታ ስርጭት ደረጃ (Live Stream Level)</h5>ይህ በቀጥታ ከሆስትነት ሥራዎ ጋር የተገናኘ ነው። የቀጥታ ስርጭት ሰዓትዎ ሲጨምር፣ ብዙ ተመልካቾች ሲከተሉዎትና ብዙ ስጦታ (Points) ሲሰበስቡ ይህ ደረጃ ከፍ ይላል። ይህም የቪዲዮ ጥራትዎንና የገጽ ቅድሚያዎን ይጨምራል።</div></div>",
"Hoostiin kamiyyuu sadarkaalee bu’uuraa kanneen beekuu qaba:<div class='g'><div class='b'><h5>👑 Sadarkaa Qabeenyaa (Wealth Level)</h5>Sadarkaan kun baasii saantimaa (coins) baastan irratti hundaa’a. Mallattoolee addaa (badges), seensa babbareedoo fi kabaja addaa argattu.</div><div class='b'><h5>📡 Sadarkaa Tamsaasa Kallattii (Live Stream Level)</h5>Kun kallattiin hojii hoostummaa keessaniin walqabata. Sa’aatii tamsaasaa fi qabxii walitti qabdan irratti hundaa’uun dabala.</div></div>"),
L("3. የግብዣ (Invitation) ሂደት እና መመሪያ","3. Adeemsa Affeerraa (Invitation Process)",
"አዳዲስ ጓደኞችን ወይም ተጠቃሚዎችን ወደ Vone ሲጋብዙ የሚገኝ ተጨማሪ የኮሚሽን ገቢ አለ፦<ul><li>የራስዎን ልዩ የግብዣ ሊንክ (Invitation Link ወይም Code) ከመተግበሪያው ላይ ማውጣት።</li><li>አዳዲስ ተጠቃሚዎች በእርስዎ ሊንክ እንዲመዘገቡና የሆስትነት ሥራቸውን እንዲጀምሩ ማገዝ።</li><li>የጋበዟቸው ሰዎች በሚያከናውኑት የቀጥታ ስርጭት ገቢ ላይ መተግበሪያው ቋሚ የግብዣ ጉርሻ (Referral Bonus) ለእርስዎ ይከፍላል።</li></ul>",
"Namoota haaraa gara Vone affeeruudhaan galii dabalataa argachuun ni danda’ama:<ul><li>Liinkii affeerraa (Invitation Link) keessan appilikeeshinii keessaa fudhachuu.</li><li>Namoonni haaraan liinkii keessaniin galmaa’anii akka hojii jalqaban gargaaruu.</li><li>Namoonni affeertan hojjetanii yeroo galii argatan, boonasii affeerraa argattu.</li></ul>")]},

{day:3,icon:"🛡️",pa:"የጌም ጉዳቶች፣ የኮይን ሽያጭ እና VIP",po:"Miidhaa Geemii, Gurgurtaa Saantimaa fi VIP",
pts:["⚠️ ስለ ጌም (disadvantages)","💸 የኮይን ሻጭ (coinseller)","👉 ስለ VIP 💸 🔥 (vip)"],
mods:[L("1. ስለ ጌም ጉዳቶች (Disadvantages of Games)","1. Miidhaa Geemii (Disadvantages of Games)",`<strong style='color:#fbbf24'>⚠️ በፕላትፎርሙ ላይ ጌም መጫወት የሚያስከትላቸው ዋና ዋና ጉዳቶች (Disadvantages of In-App Games)</strong><p style='margin:.4rem 0'>ብዙ ተጠቃሚዎችና ሆስቶች በቀላሉ ኮይን ለማብዛት በማሰብ በመተግበሪያው ውስጥ ወደሚገኙት ጌሞች ይገባሉ። ይሁን እንጂ እነዚህ ጨዋታዎች የተዘጋጁት ፕላትፎርሙ እንጂ ተጫዋቹ እንዲያተርፍ ባለመሆኑ ከፍተኛ የገንዘብ፣ የስነ-ልቦና እና የስራ ውድቀት ያስከትላሉ።</p><strong style='color:#fbbf24'>1. ከባድ የገንዘብ ኪሳራ (Severe Financial Loss)</strong><ul><li><strong>የተጠቃሚዎችን ገቢ ማጥፋት፦</strong> ብዙ ሰዎች በድካም ያገኙትን ኮይን ወይም ከኪሳቸው ገንዘብ አውጥተው የገዙትን ሳንቲም በአንድ ቅጽበት ያጣሉ።</li><li><strong>ምሳሌ፦</strong> አንድ ሰው 100 ዶላር አውጥቶ የገዛውን ኮይን በ10 ደቂቃ ጌም ውስጥ ሙሉ በሙሉ ሊያጣው ይችላል። "ያጣሁትን አስመልሳለሁ" በሚል ስሜት ደግሞ ተጨማሪ ገንዘብ እያስገቡ መበደርና ባዶ እጅ መቅረት የተለመደ ነው።</li></ul><strong style='color:#fbbf24'>2. አደገኛ ሱስ እና የስሜት መረበሽ (Addiction & Emotional Breakdown)</strong><ul><li><strong>የአእምሮ ሱስ (Psychological Addiction)፦</strong> ጌሞቹ የተሰሩት "አሁን ልበላ ነው" የሚል የውሸት ተስፋ እንዲሰማ በማድረግ ሰው ሱስ ውስጥ እንዲገባ ነው።</li><li><strong>ቁጣና ጭንቀት፦</strong> ተጠቃሚው በተከታታይ ሲበላ ከፍተኛ ንዴት፣ ጸጸት እና ጭንቀት ውስጥ ይገባል። ይህም ከቤተሰብና ከጓደኞች ጋር ያለውን ግንኙነት ያበላሻል።</li></ul><strong style='color:#fbbf24'>3. ትኩረትን እና የስራ ጊዜን ማባከን (Loss of Productive Time)</strong><ul><li><strong>ሆስቶች ስራቸውን እንዲጥሉ ያደርጋል፦</strong> አንድ ሆስት ላይቭ ላይ ተቀምጣ ከታዳሚዎች ጋር ማውራት፣ ተከታዮችን ማፍራት እና ስጦታ (Gifts) ማሰባሰብ ሲገባት፣ ጊዜዋን በሙሉ ጌም በመጫወት ካሳለፈች ታዳሚዎቿ ይሰላቹና ይተዋታል።</li><li>ይሄም ሆስቷ የረጅም ጊዜ ቋሚ ገቢዋን እንድታጣ ያደርጋታል።</li></ul><strong style='color:#fbbf24'>4. አልጎሪዝሙ የተሰራው እንዲበላ ተደርጎ ነው (House Always Wins)</strong><ul><li>ምንም አይነት ጥናት ወይም ብልጠት ጌሙን ማሸነፍ አያስችለውም። ሲስተሙ በኮምፒውተር አልጎሪዝም የተመሰረተ በመሆኑ፣ በመጨረሻ ላይ አሸናፊ ሆኖ የሚወጣው ፕላትፎርሙ ብቻ ነው። ትንሽ እንዲያሸንፉ የሚያደርገውም ትልቅ ገንዘብ እንድታስገቡ ወጥመድ ለመጣል ነው።</li></ul><div style='margin-top:.8rem;padding:.75rem;border-radius:.75rem;border:1px solid rgba(239,68,68,.4);background:rgba(127,29,29,.2)'><strong style='color:#fca5a5'>📌 ለቡድናችን እና ለተጠቃሚዎች የሚተላለፍ የማስጠንቀቂያ መልእክት</strong><p style='margin:.4rem 0'><strong>"እኛ የምንፈልገው የእናንተን እድገት እና ስኬት እንጂ ኪሳራችሁን አይደለም!"</strong></p><p style='margin:.4rem 0'>በፕላትፎርሙ ላይ እውነተኛ ገቢ የሚገኘው በታታሪነት ላይቭ በመግባት፣ ጥሩ ይዘት በማቅረብ እና እውነተኛ ተከታዮችን በማፍራት ብቻ ነው። በጌም የሚገኝ ዘላቂ ትርፍ የለም፤ ጌም መጫወት የደከማችሁበትን ገቢ ከማሳጣት ውጪ ምንም ፋይዳ ስለሌለው ሁሉም አባሎቻችንና ተጠቃሚዎች ከእነዚህ ጌሞች እንዲርቁ በጥብቅ እናሳስባለን።</p></div>`,`<strong style='color:#fbbf24'>⚠️ Miidhaawwan Ijoo Geemii Waltajjii Irratti Taphachuun Fidu (Disadvantages of In-App Games)</strong><p style='margin:.4rem 0'>Fayyadamtoonni fi hoostonni baay’een saantima salphaatti dabaluuf yaaluun geemiiwwan appilikeeshinii keessa jiran seenu. Haa ta’u malee, taphoonni kun kan qophaa’an waltajjiin akka bu’aa argatuuf malee taphataan akka bu’aa argatu waan hin taaneef, kufaatii maallaqaa, sammuu fi hojii cimaa fida.</p><strong style='color:#fbbf24'>1. Kasaaraa Maallaqaa Cimaa (Severe Financial Loss)</strong><ul><li><strong>Galii Fayyadamtootaa Balleessuu:</strong> Namoonni baay’een saantima dadhabanii argatan ykn maallaqa ofii baasanii bitatan daqiiqaa tokko keessatti dhabu.</li><li><strong>Fakkeenya:</strong> Namni tokko doolaara 100 baasee saantima bite daqiiqaa 10 geemii keessatti guutummaatti dhabuu danda’a. “Kan dhabe deebisa” jedhee maallaqa dabalataa galchuu, liqeeffachuu fi harka duwwaa hafuun baratamaadha.</li></ul><strong style='color:#fbbf24'>2. Fudhatama Hamaa fi Sammuu Walqunnamuu (Addiction & Emotional Breakdown)</strong><ul><li><strong>Fudhatama Sammuu (Psychological Addiction):</strong> Geemiiwwan kun “amma moona” jedhu abdii sobaa dhaga’isuun nama gara fudhatamaatti galchuuf kan hojjetaman dha.</li><li><strong>Aariifi Yaaddoo:</strong> Fayyadamaan yeroo hedduu yoo hin mo’atin aariin, gaabbii fi yaaddoo cimaa keessa seena. Kunis walitti dhufeenya maatii fi hiriyoota wajjin qabu ni diigaa.</li></ul><strong style='color:#fbbf24'>3. Xiyyeeffannoo fi Yeroo Hojii Balleessuu (Loss of Productive Time)</strong><ul><li><strong>Hoostonni hojii isaanii akka dhiisan godha:</strong> Hoostiin tokko live irra taa’uun daawwattoota wajjin haasa’uu, hordoftoota horachuu fi kennaa (Gifts) walitti qabuu qabdu yeroo ishee guutuu geemii taphachuun yoo dabarsite, daawwattoonni ishee itti nuffanii ishee dhiisu.</li><li>Kunis hoostittiin galii yeroo dheeraa dhaabbataa ishee akka dhabdu taasisa.</li></ul><strong style='color:#fbbf24'>4. Algoorizimiin Kan Hojjetame Akka Moo’atuuf (House Always Wins)</strong><ul><li>Qorannoon ykn ogummaan kamiyyuu geemii mo’achuu hin dandeessisu. Sirnichi algoorizimii kompuutaraatiin kan ijaarame waan ta’eef, dhuma irratti kan mo’atu waltajjii qofa dha. Xiqqoo akka mo’attan kan godhu maallaqa guddaa akka galchitan kiyyoo kaa’uuf dha.</li></ul><div style='margin-top:.8rem;padding:.75rem;border-radius:.75rem;border:1px solid rgba(239,68,68,.4);background:rgba(127,29,29,.2)'><strong style='color:#fca5a5'>📌 Ergaa Akeekkachiisaa Garee fi Fayyadamtootaaf Dabarsamu</strong><p style='margin:.4rem 0'><strong>“Nuti kan barbaannu guddina fi milkaa’ina keessan malee kasaaraa keessan miti!”</strong></p><p style='margin:.4rem 0'>Waltajjii irratti galiin dhugaa kan argamu dadhabbiidhaan live seenuu, qabiyyee gaarii dhiheessuu fi hordoftoota dhugaa horachuudhaan qofa. Geemii irraa bu’aan itti fufiinsa qabu hin jiru; geemii taphachuun galii dadhabdanii argattan dhabsiisuu malee faayidaa tokko iyyuu hin qabu. Kanaaf miseensonni keenya fi fayyadamtoonni hundi geemiiwwan kana irraa akka fagaatan cimsinee isin gorsina.</p></div>`),L("2. የኮይን ሻጭ (Coinseller) አሠራር","2. Hojimaata Gurguraa Saantimaa (Coinseller)",`<ul style='list-style:none;padding:0'><li style='margin:.5rem 0'><strong>ምንነቱ፦</strong> በመተግበሪያው ውስጥ የሚገበያዩትን ሳንቲሞች (Coins) በጅምላ ከኩባንያው በመግዛት ለተጠቃሚዎች እና ለሆስቶች በችርቻሮ መሸጥ ነው።</li><li style='margin:.5rem 0'><strong>የገቢ መንገድ፦</strong> በጅምላ ግዢና በሽያጭ ዋጋ መካከል ባለው ልዩነት (Profit Margin) የሚገኝ ንጹህ ትርፍ ነው።</li><li style='margin:.5rem 0'><strong>ጥቅሙ፦</strong> ከፍተኛ የተጠቃሚዎች ቁጥር ባለበት ገበያ ውስጥ ተዓማኒነትን በመፍጠር በየቀኑ ፈጣን የጥሬ ገንዘብ ዝውውር ያስገኛል።</li></ul>`,`<ul style='list-style:none;padding:0'><li style='margin:.5rem 0'><strong>Maal:</strong> Saantima (Coins) appilikeeshinii keessatti daldalaman kampanii irraa heddumminaan bitanii fayyadamtootaa fi hoostotaaf xixiqqeessanii gurguruudha.</li><li style='margin:.5rem 0'><strong>Karaa galii:</strong> Garaagarummaa gatii bitaa fi gurgaa jidduu jiru (Profit Margin) irraa bu’aa qulqulluu argachuudha.</li><li style='margin:.5rem 0'><strong>Faayidaa:</strong> Gabaa fayyadamtoonni baay’een jiran keessatti amanamummaa uumuun guyyaa guyyaan sochii maallaqaa ariifataa argamsiisa.</li></ul>`),L("3. ስለ VIP አባልነት (About VIP 💸 🔥)","3. Waa’ee Miseensummaa VIP",`<strong style='color:#fbbf24'>የቪአይፒ (VIP) ደረጃዎች ማጠቃለያ ሰንጠረዥ</strong><div style='overflow-x:auto;margin:.5rem 0'><table style='width:100%;border-collapse:collapse;font-size:.75rem'><tr><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>የቪአይፒ ደረጃ (VIP Tier)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>የሚያስፈልገው ኮይን (ዋጋ)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>የቆይታ ጊዜ</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>በየቀኑ የሚሰጠው ኮይን (Daily Claim)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>በወር የሚሰበሰበው ጠቅላላ ኮይን (~30 ቀናት)</th></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>Normal VIP</td><td style='border:1px solid #3f3f46;padding:.4rem'>95,000 Coins</td><td style='border:1px solid #3f3f46;padding:.4rem'>1 ወር (/M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>+3,500 Coins</td><td style='border:1px solid #3f3f46;padding:.4rem'>~105,000 Coins</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>Super VIP</td><td style='border:1px solid #3f3f46;padding:.4rem'>450,000 Coins</td><td style='border:1px solid #3f3f46;padding:.4rem'>1 ወር (/M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>+16,000 Coins</td><td style='border:1px solid #3f3f46;padding:.4rem'>~480,000 Coins</td>< mods:[L("1. ሮኬት ሆስት (Rocket Host 🔥)","1. Rookeet Hoostii (Rocket Host)",`<strong style='color:#fbbf24'>የ Rocket Host ደሞዝ እና የአሠራር ማጠቃለያ</strong><ul><li><strong>ዋና ዓላማው፦</strong> ተሰጥኦ ያላቸው ወንድ ሆስቶች በራሳቸው ገለልተኛ የቀጥታ ስርጭት (Solo Live) ችሎታቸውን እንዲያሳዩና ተጨማሪ ሳምንታዊ ቋሚ ደሞዝ (Weekly Base Salary) እንዲያገኙ የተዘጋጀ ነው።</li><li><strong>የስርጭት ሰዓት ክፍያ፦</strong> በሳምንት ውስጥ 4 ሰዓት ሲጠናቀቅ 5 USD፣ እንዲሁም 8 ሰዓት ሲደርስ ተጨማሪ 5 USD (በድምሩ 10 USD) ይከፈላል (የሚታሰበው በቀን ከፍተኛው 2 ሰዓት Solo Live ብቻ ነው)።</li><li><strong>ሳምንታዊ የነጥብ ቦነስ፦</strong> ከሚሰበሰብ ነጥብ በተጨማሪ ከ 500,000 ፖይንት (5 USD) ጀምሮ እስከ 8,000,000 ፖይንት (5 USD) ተጨማሪ ክፍያ ይሰጣል፤ 10,000,000 ፖይንት ሲደርስ የ Super Rocket Host Tag ባጅ ይሰጠዋል።</li><li><strong>ሳምንታዊ የደረጃ ሽልማት (Weekly Ranking)፦</strong> በየሳምንቱ ከፍተኛ ገቢ ካስመዘገቡት ውስጥ ከደረጃ 1 እስከ 50 ላሉት ከ 1 USD እስከ 120 USD ተጨማሪ ሽልማት ይሰጣል።</li><li><strong>የማመልከቻ መስፈርት፦</strong> ከ45 ሰከንድ ያላነሰ የተሰጥኦ ወይም የራስ መተዋወቂያ ቪዲዮ በዋትስአፕ በ +8618930578074 በመላክ ይመዘገባል።</li><li><strong>የተግባር ሽልማት አወሳሰድ፦</strong> የተጠናቀቁ ተግባራት ሽልማት በ Rocket Host Page ውስጥ ገብቶ በእጅ (Claim) መደረግ አለበት።</li></ul><p style='margin:.8rem 0 0'><a href='https://docs.google.com/document/d/1koDqSuhvu60hvHk5pKC4_SJgO0is-PyzSrj4O3eADgI/edit?tab=t.0' target='_blank' rel='noopener noreferrer' style='display:inline-block;padding:.5rem .9rem;border-radius:.75rem;background:#f59e0b;color:#000;font-weight:800;text-decoration:none'>🔗 ሙሉ የ Rocket Host መመሪያ ሰነድ (Rocket Host Official Policy Document)</a></p>`,`<strong style='color:#fbbf24'>Cuunfaa Mindaa fi Hojimaata Rocket Host</strong><ul><li><strong>Kaayyoo Isaa:</strong> Hoostonni dhiiraa dandeettii qaban tamsaasa kallattii of danda’e (Solo Live) isaaniitiin dandeettii isaanii agarsiisanii mindaa torbanii dhaabbataa (Weekly Base Salary) dabalataa akka argatan kan qophaa’e dha.</li><li><strong>Kaffaltii Sa’aatii Tamsaasaa:</strong> Torban keessatti sa’aatii 4 yeroo xumuramu 5 USD, sa’aatii 8 yeroo ga’u immoo 5 USD dabalataa (waliigalaan 10 USD) kaffalama (guyyaatti Solo Live sa’aatii 2 olaanaan qofa lakkaa’ama).</li><li><strong>Boonasii Qabxii Torbanii:</strong> Qabxii walitti qabamu irratti dabalataan qabxii 500,000 (5 USD) irraa kaasee hanga qabxii 8,000,000 (5 USD) kaffaltii dabalataa kennama; qabxiin 10,000,000 yeroo ga’u mallattoo Super Rocket Host Tag argata.</li><li><strong>Badhaasa Sadarkaa Torbanii (Weekly Ranking):</strong> Torban torbaniin warra galii olaanaa galmeessan keessaa sadarkaa 1 hanga 50 jiraniif badhaasa dabalataa 1 USD hanga 120 USD kennama.</li><li><strong>Ulaagaa Iyyannoo:</strong> Viidiyoo dandeettii ykn of beeksisuu sekondii 45 gadi hin taane WhatsApp irratti lakkoofsa +8618930578074 tti erguun galmaa’u.</li><li><strong>Akkaataa Badhaasa Hojii Fudhachuu:</strong> Badhaasni hojiiwwan xumuraman Rocket Host Page keessa seenuun harkaan (Claim) fudhatamuu qaba.</li></ul><p style='margin:.8rem 0 0'><a href='https://docs.google.com/document/d/1koDqSuhvu60hvHk5pKC4_SJgO0is-PyzSrj4O3eADgI/edit?tab=t.0' target='_blank' rel='noopener noreferrer' style='display:inline-block;padding:.5rem .9rem;border-radius:.75rem;background:#f59e0b;color:#000;font-weight:800;text-decoration:none'>🔗 Qajeelfama Rocket Host guutuu (Rocket Host Official Policy Document)</a></p>`),L("2. ኤስ-አይዶል (S Idol 🔥)","2. Ees-Aayidol (S Idol)",`<strong style='color:#fbbf24'>1. ኤስ-አይዶል (S-Idol) መሆን ምን ማለት ነው?</strong><p style='margin:.4rem 0'>አንድ ሆስት S-idol ሲሆን መደበኛ የቀን ተግባራት (Daily tasks) ይቆማሉ፤ በምትኩ የተሻሻለ የደሞዝ እና የቦነስ ፖሊሲ ተፈጻሚ ይሆናል።</p><strong style='color:#fbbf24'>2. የቀጥታ ስርጭት ሰዓት ክፍያ (Live Duration Rewards)</strong><ul><li>በወር ውስጥ ከ 6 ሰዓት እስከ 30 ሰዓት ድረስ ለሚሠራው ብቸኛ የቀጥታ ስርጭት (Solo Live) በየደረጃው ከ 6 USD እስከ 30 USD ተጨማሪ ደሞዝ ያገኛሉ።</li><li>በቀን ውስጥ የሚቆጠረው ከፍተኛው የ Solo Live ሰዓት 2 ሰዓት ብቻ ነው።</li></ul><strong style='color:#fbbf24'>3. የወርሃዊ ነጥብ ገቢ ቦነስ (Monthly Income Targets)</strong><p style='margin:.4rem 0'>በስጦታዎች (Gifts) ከሚሰበሰብ ፖይንት በተጨማሪ ተጨማሪ የዶላር ክፍያ ያገኛሉ፦</p><ul><li>500,000 ፖይንት፦ +5 USD</li><li>2,500,000 ፖይንት፦ +10 USD</li><li>5,000,000 ፖይንት፦ +20 USD</li><li>9,000,000 ፖይንት፦ +40 USD</li><li>20,000,000 ፖይንት፦ +60 USD</li><li>60,000,000 ፖይንት እና በላይ፦ +80 USD</li></ul><strong style='color:#fbbf24'>4. የላቀ ደረጃ (SS-Idol)</strong><p style='margin:.4rem 0'>ባለፈው ወር ውስጥ የነጥብ ገቢያቸው 40 ሚሊዮን (40,000,000) ፖይንት እና ከዚያ በላይ የደረሱ ሆስቶች የሰዓት ክፍያቸው እጥፍ (Double) ይሆንላቸዋል (በየ 6 ሰዓቱ 12 USD)።</p><strong style='color:#fbbf24'>5. ተጨማሪ ጉርሻዎች እና ተግባራት</strong><ul><li><strong>የሰዓት ጉርሻ (Extra Reward)፦</strong> በወር ውስጥ ከ 50 ሰዓት በላይ የቀጥታ ስርጭት ለሠራ/ች +10 USD።</li><li><strong>የPK ተግባር፦</strong> 5 እና ከዚያ በላይ የዘፈቀደ የPK ውድድሮችን (Random PK) ሲያሸንፉ +9 USD።</li><li><strong>ሳምንታዊ ደረጃ (Weekly Income Rank)፦</strong> በየሳምንቱ ከፍተኛ ገቢ ካስመዘገቡት ውስጥ ከደረጃ 1 እስከ 50 ላሉት ከ 1 USD እስከ 120 USD ተጨማሪ ሽልማት ይሰጣል።</li></ul><strong style='color:#fbbf24'>6. የማመልከቻ መስፈርት (How to Apply)</strong><p style='margin:.4rem 0'>ማመልከቻው ለሴቶች ብቻ ክፍት ሲሆን (ኤጀንቶች አይካተቱም)፣ የ45 ሰከንድ የተሰጥኦ (Talent) ቪዲዮ፣ የPoppo መለያ እና የሌሎች መድረኮች የስራ ልምድ ማረጋገጫ ወደ ይፋዊው ኢሜይል (sidol@v.show) በመላክ ይመዘገባሉ።</p><p style='margin:.8rem 0 0'><a href='https://docs.google.com/document/d/1c46XOdWh-5tC2LucpM4Cr25yPB_DdtBkWkX_WainF-s/edit?tab=t.0#heading=h.uuv4m2r7sgcu' target='_blank' rel='noopener noreferrer' style='display:inline-block;padding:.5rem .9rem;border-radius:.75rem;background:#f59e0b;color:#000;font-weight:800;text-decoration:none'>🔗 የ S-Idol መመሪያ ሙሉ ዝርዝር (S-Idol Policy Document)</a></p>`,`<strong style='color:#fbbf24'>1. S-Idol (Ees-Aayidol) Ta’uun Maal Jechuudha?</strong><p style='margin:.4rem 0'>Hoostiin tokko S-idol yeroo ta’u hojiiwwan guyyaa idilee (Daily tasks) ni dhaabbatu; bakka isaanitti imaammanni mindaa fi boonasii foyya’e hojiirra oola.</p><strong style='color:#fbbf24'>2. Badhaasa Yeroo Tamsaasa Kallattii (Live Duration Rewards)</strong><ul><li>Ji’a keessatti sa’aatii 6 hanga 30 tamsaasa kallattii kophaa (Solo Live) geggeessuuf, sadarkaa sadarkaadhaan 6 USD hanga 30 USD mindaa dabalataa argatu.</li><li>Guyyaa tokko keessatti sa’aatiin Solo Live olaanaan lakkaa’amu sa’aatii 2 qofa.</li></ul><strong style='color:#fbbf24'>3. Boonasii Galii Qabxii Ji’aa (Monthly Income Targets)</strong><p style='margin:.4rem 0'>Qabxii kennaa (Gifts) irraa walitti qabamu irratti dabalataan kaffaltii doolaara dabalataa argatu:</p><ul><li>Qabxii 500,000: +5 USD</li><li>Qabxii 2,500,000: +10 USD</li><li>Qabxii 5,000,000: +20 USD</li><li>Qabxii 9,000,000: +40 USD</li><li>Qabxii 20,000,000: +60 USD</li><li>Qabxii 60,000,000 fi isaa ol: +80 USD</li></ul><strong style='color:#fbbf24'>4. Sadarkaa Olaanaa (SS-Idol)</strong><p style='margin:.4rem 0'>Hoostonni ji’a darbe keessatti galiin qabxii isaanii miliyoona 40 (40,000,000) fi isaa ol gahan, kaffaltiin sa’aatii isaanii dachaa (Double) ta’a (sa’aatii 6 hundaaf 12 USD).</p><strong style='color:#fbbf24'>5. Boonasii fi Hojiiwwan Dabalataa</strong><ul><li><strong>Boonasii Sa’aatii (Extra Reward):</strong> Ji’a keessatti sa’aatii 50 ol tamsaasa kallattii kan hojjete +10 USD.</li><li><strong>Hojii PK:</strong> Dorgommii PK carraa (Random PK) 5 fi isaa ol yeroo mo’atan +9 USD.</li><li><strong>Sadarkaa Torbanii (Weekly Income Rank):</strong> Torban torbaniin warra galii olaanaa galmeessan keessaa sadarkaa 1 hanga 50 jiraniif badhaasa dabalataa 1 USD hanga 120 USD kennama.</li></ul><strong style='color:#fbbf24'>6. Ulaagaa Iyyannoo (How to Apply)</strong><p style='margin:.4rem 0'>Iyyannoon dubartootaaf qofa banaadha (eejantoonni hin dabalaman); viidiyoo dandeettii (Talent) sekondii 45, akkaawuntii Poppo fi mirkaneessa muuxannoo hojii waltajjii biroo imeelii ifa ta’e (sidol@v.show) tti erguun galmaa’u.</p><p style='margin:.8rem 0 0'><a href='https://docs.google.com/document/d/1c46XOdWh-5tC2LucpM4Cr25yPB_DdtBkWkX_WainF-s/edit?tab=t.0#heading=h.uuv4m2r7sgcu' target='_blank' rel='noopener noreferrer' style='display:inline-block;padding:.5rem .9rem;border-radius:.75rem;background:#f59e0b;color:#000;font-weight:800;text-decoration:none'>🔗 Qajeelfama S-Idol guutuu (S-Idol Policy Document)</a></p>`),L("3. እስቲልኒድ (Stellneed 👉)","3. Istiilniid (Stellneed)",`<strong style='color:#fbbf24'>1. ዋና ዋና ህጎች (Rules)</strong><ul><li><strong>የገቢ ስሌት፦</strong> የዕለት ተዕለት ታስክ ደረጃ የሚወሰነው ሆስቷ ባለፉት 7 ቀናት ውስጥ ባስገኘችው ጠቅላላ የላይቭ እና የፓርቲ ገቢ ላይ ተመስርቶ ነው (የፕላትፎርም ሽልማቶችን ሳይጨምር)።</li><li><strong>ደረጃ ማሳደግ፦</strong> ገቢው ባደገ ቁጥር የታስክ ደረጃውን ወዲያውኑ ማሳደግ ይቻላል፤ ነገር ግን የአንድ ጊዜ ታስክ ሽልማት አንዴ ብቻ ነው ክሌይም (claim) የሚደረገው።</li><li><strong>ሽልማቶች፦</strong> ሁሉም የታስክ ክፍያዎች በፖይንት (Points) የሚሰጡ ናቸው።</li></ul><strong style='color:#fbbf24'>2. የደረጃዎች ዝርዝር እና ክፍያ (Level Tasks)</strong><div style='overflow-x:auto;margin:.5rem 0'><table style='width:100%;border-collapse:collapse;font-size:.75rem'><tr><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>ደረጃ (Level)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>ባለፉት 7 ቀናት የተገኘ ገቢ</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>የታስክ ክፍያ በሰዓት</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>የሚሰራበት ሰዓት በቀን</th></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>S</td><td style='border:1px solid #3f3f46;padding:.4rem'>50,000,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>70,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 4 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>A</td><td style='border:1px solid #3f3f46;padding:.4rem'>22,000,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>50,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 4 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>B</td><td style='border:1px solid #3f3f46;padding:.4rem'>10,000,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>40,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 3 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>C</td><td style='border:1px solid #3f3f46;padding:.4rem'>7,000,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>35,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 3 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>D</td><td style='border:1px solid #3f3f46;padding:.4rem'>4,000,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>28,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 3 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>E</td><td style='border:1px solid #3f3f46;padding:.4rem'>2,000,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>18,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 3 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>F</td><td style='border:1px solid #3f3f46;padding:.4rem'>1,200,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>12,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 3 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>G</td><td style='border:1px solid #3f3f46;padding:.4rem'>900,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>9,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 3 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>H</td><td style='border:1px solid #3f3f46;padding:.4rem'>300,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>5,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 2 ሰዓት</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>I</td><td style='border:1px solid #3f3f46;padding:.4rem'>150,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>3,000 ፖይንት / በሰዓት</td><td style='border:1px solid #3f3f46;padding:.4rem'>በቀን 2 ሰዓት</td></tr></table></div><strong style='color:#fbbf24'>3. ለአዲስ እና ለመደበኛ ሆስቶች (New & Ordinary Hosts)</strong><ul><li><strong>አዲስ ሆስቶች (New Hosts)፦</strong> በተመዘገቡ በመጀመሪያዎቹ 7 ቀናት ውስጥ በቀን ለ 2 ሰዓት በመስራት በሰዓት 5,000 ፖይንት ያገኛሉ።</li><li><strong>መደበኛ ሆስቶች (Ordinary Hosts)፦</strong> አዲስ ያልሆኑ እና ባለፉት 7 ቀናት ያገኙት ገቢ ከ150,000 ፖይንት በታች የሆኑ ሆስቶች በቀን ለ 1 ሰዓት በመስራት በሰዓት 1,000 ፖይንት ያገኛሉ።</li></ul><strong style='color:#fbbf24'>4. አስፈላጊ ማሳሰቢያዎች (Notice)</strong><ul><li>ገቢው የታለመው ደረጃ ላይ በደረሰ በሁለተኛው ቀን አዲሱ የታስክ ደረጃ በራስ-ሰር ይከፈታል።</li><li>ከአንድ በላይ አካውንት መክፈት፣ በበርካታ ስልኮች ወይም አይፒ (IP) አድራሻዎች መጠቀም ከታስክ ሲስተሙ ሙሉ በሙሉ ያስወጣል።</li></ul>`,`<strong style='color:#fbbf24'>1. Seerota Ijoo (Rules)</strong><ul><li><strong>Herrega Galii:</strong> Sadarkaan tasgii guyyaa guyyaa galii live fi party waliigalaa hoostittiin guyyoota 7 darban keessatti argatte irratti hundaa’a (badhaasa waltajjii hin dabalatu).</li><li><strong>Sadarkaa Guddisuu:</strong> Galiin yeroo guddatu sadarkaan tasgii battalumatti guddisuun ni danda’ama; garuu badhaasni tasgii altokko qofa al tokko claim godhama.</li><li><strong>Badhaasa:</strong> Kaffaltiin tasgii hundi qabxiidhaan (Points) kennama.</li></ul><strong style='color:#fbbf24'>2. Tarree Sadarkaalee fi Kaffaltii (Level Tasks)</strong><div style='overflow-x:auto;margin:.5rem 0'><table style='width:100%;border-collapse:collapse;font-size:.75rem'><tr><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Sadarkaa (Level)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Galii guyyoota 7 darban argame</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Kaffaltii tasgii sa’aatiin</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Sa’aatii hojii guyyaa</th></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>S</td><td style='border:1px solid #3f3f46;padding:.4rem'>50,000,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>70,000 qabxii / sa’aatii</td><td style='border:1px solid #3f3f46;padding:.4rem'>Guyyaatti :#fcd34d'>G</td><td style='border:1px solid #3f3f46;padding:.4rem'>900,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>9,000 qabxii / sa’aatii</td><td style='border:1px solid #3f3f46;padding:.4rem'>Guyyaatti sa’aatii 3</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>H</td><td style='border:1px solid #3f3f46;padding:.4rem'>300,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>5,000 qabxii / sa’aatii</td><td style='border:1px solid #3f3f46;padding:.4rem'>Guyyaatti sa’aatii 2</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>I</td><td style='border:1px solid #3f3f46;padding:.4rem'>150,000</td><td style='border:1px solid #3f3f46;padding:.4rem'>3,000 qabxii / sa’aatii</td><td style='border:1px solid #3f3f46;padding:.4rem'>Guyyaatti sa’aatii 2</td></tr></table></div><strong style='color:#fbbf24'>3. Hoostota Haaraa fi Idilee (New & Ordinary Hosts)</strong><ul><li><strong>Hoostota Haaraa (New Hosts):</strong> Guyyoota 7 jalqabaa erga galmaa’anii booda guyyaatti sa’aatii 2 hojjetanii sa’aatiin qabxii 5,000 argatu.</li><li><strong>Hoostota Idilee (Ordinary Hosts):</strong> Haaraa kan hin taane fi galiin isaanii guyyoota 7 darban keessatti qabxii 150,000 gadi ta’e guyyaatti sa’aatii 1 hojjetanii sa’aatiin qabxii 1,000 argatu.</li></ul><strong style='color:#fbbf24'>4. Beeksisa Barbaachisaa (Notice)</strong><ul><li>Galiin sadarkaa kaayyeffame gahee guyyaa lammaffaatti sadarkaan tasgii haaraan ofumaan banama.</li><li>Akkaawuntii tokko ol banuun, bilbila baay’ee ykn teessuma IP baay’ee fayyadamuun sirna tasgii keessaa guutummaan guutuutti nama baasa.</li></ul>`)]},
{day:5,icon:"👑",pa:"ኤጀንት (Agent) መሆን እና የኤጀንት ደረጃዎች",po:"Eejantii Ta’uu fi Sadarkaalee Eejantii",
pts:["🎯 ኤጀንት (agent)","🎯 የኤጀንት ደረጃዎች (levels)"],
mods:[L("1. ኤጀንት (Agent) መሆን ምን ማለት ነው?","1. Eejantii (Agent) Ta’uun Maal Jechuudha?",`<strong style='color:#fbbf24'>1. ኤጀንት (Agent) መሆን ምን ማለት ነው?</strong><p style='margin:.4rem 0 .9rem'>ኤጀንት ማለት በመድረኩ ላይ ራስዎ ብቻዎን ካሜራ ፊት ተቀምጠው ስጦታ ወይም የቀን ታስክ ከሚጠብቁ ይልቅ፣ የራስዎን የሆስቶች ቡድን (Team) የሚመሩ፣ የሚያሰለጥኑ እና የሚያስተዳድሩ የቢዝነስ መሪ መሆን ማለት ነው። መድረኩ እርስዎ ቡድን አደራጅተው አዳዲስ ተሰጥኦ ያላቸውን ሆስቶች ወደ ሥራው ስላመጡ እና አብረዋቸው ስለሚሠሩ የተወሰነ የኮሚሽን ድርሻ ይከፍልዎታል።</p><strong style='color:#fbbf24'>2. ያለ ቀጥታ ስርጭት ተገብሮ ገቢ (Passive Income) እንዴት ይገኛል?</strong><p style='margin:.4rem 0'>ተገብሮ ገቢ ማለት እርስዎ በቀጥታ በሰዓቱ ባይደክሙም ወይም ካሜራ ፊት ባይቀመጡም ገንዘብ ወደ እርስዎ የሚፈስበት አሠራር ነው፦</p><ul><li><strong>የሰዓት ነፃነት፦</strong> እርስዎ በቀን 2 ወይም 3 ሰዓት ላይቭ ላይ ተቀምጠው ማውራት ላይጠበቅብዎት ይችላል።</li><li><strong>የቡድን ጉልበት (Leverage)፦</strong> በእርስዎ ስር ለምሳሌ 15 ወይም 30 ሆስቶች ቢኖሩ፣ እያንዳንዳቸው በቀን የየራሳቸውን የቀጥታ ስርጭት ሲያካሂዱ፣ ከእያንዳንዱ ሆስት የሚገኘው የኮሚሽን ነጥብ በቀጥታ ወደ እርስዎ የኤጀንሲ ገቢ ገቢ ይሆናል።</li><li><strong>የደረጃ ዕድገት (Agent Levels)፦</strong> የኤጀንሲዎ አጠቃላይ ሳምንታዊ ገቢ እያደገ ሲሄድ የኮሚሽን ፐርሰንትዎ ከዝቅተኛ ደረጃ ወደ ከፍተኛ ደረጃ ያድጋል።</li></ul><strong style='color:#fbbf24'>3. ለሆስቶች የሚሰጡት ድጋፍና አገልግሎት ምን መሆን አለበት?</strong><p style='margin:.4rem 0'>አንድ ጠንካራ ኤጀንት ቡድኑን ስኬታማ በማድረግ የራሱን ገቢ ለማሳደግ የሚከተሉትን ዋና ዋና ተግባራት ለሆስቶቹ ያከናውናል፦</p><ul><li><strong>መመሪያና ሥልጠና መስጠት፦</strong> አዳዲስ አባላት ሲገቡ እንዴት አካውንታቸውን እንደሚያረጋግጡ፣ የመገለጫ ፎቶ (Profile) እና ባዮ (Bio) እንዴት ማራኪ እንደሚያደርጉ ማስተማር። የቀን ተግባራትን (Daily Tasks)፣ የሰዓት አጠቃቀምን እና የመድረኩን ሕጎች ማስረዳት።</li><li><strong>ክትትልና ማበረታቻ፦</strong> በየቀኑ የሆስቶችን የሥራ ሰዓት መከታተል፣ ግባቸውን (Target) እንዲመቱ መርዳት እና የሚያጋጥሟቸውን የቴክኒክ ወይም የመተግበሪያ ችግሮች መፍታት።</li><li><strong>የመድረክ ድባብ መፍጠር፦</strong> አዲስ ሆስቶች ላይቭ ሲገቡ በመግባት ማበረታታት፣ በፓርቲ ክፍሎች ማስተዋወቅ እና ከሌሎች የቡድኑ አባላት ጋር የPK ውድድር እንዲያደርጉ ማመቻቸት።</li><li><strong>የክፍያና የገንዘብ አወጣጥ ድጋፍ፦</strong> ሆስቶች የሠሩትን ነጥብ (Points) ያለ ችግር ወደ እውነተኛ ገንዘብ እንዲቀይሩና እንዲያወጡ ማገዝ።</li></ul><strong style='color:#fbbf24'>4. በአጭሩ ሲጠቃለል</strong><p style='margin:.4rem 0'>ኤጀንት መሆን ማለት የሌሎችን ስኬት በማገዝ የራስን ገቢ ማሳደግ ነው። ሆስቶችዎ ባደጉ እና ብዙ ገቢ ባገኙ ቁጥር፣ እርስዎ ላይቭ ላይ ሳይቀመጡ የሚያገኙት ተገብሮ ገቢ (Passive Income) በተመሳሳይ መጠን እያደገ ይሄዳል።</p>`,`<strong style='color:#fbbf24'>1. Eejantii (Agent) Ta’uun Maal Jechuudha?</strong><p style='margin:.4rem 0 .9rem'>Eejantiin jechuun waltajjii irratti kophaa keessan kaameraa duratti taa’anii kennaa ykn tasgii guyyaa eeggachuu irra, garee hoostotaa (Team) mataa keessanii kan geggeessan, leenjisan fi bulchan hoggantuu daldalaati. Waltajjiin garee ijaaranii hoostota dandeettii qaban gara hojiitti waan fidaniif fi waliin waan hojjetaniif qooda komishinii murtaa’e isiniif kaffala.</p><strong style='color:#fbbf24'>2. Tamsaasa Kallattii Malee Galii Passive Akkamitti Argatama?</strong><p style='margin:.4rem 0'>Galiin passive jechuun isin yeroo hojii irratti osoo hin dadhabin ykn kaameraa duratti osoo hin taa’in maallaqni gara keessanitti kan yaa’u adeemsa ti:</p><ul><li><strong>Bilisummaa Yeroo:</strong> Guyyaatti sa’aatii 2 ykn 3 live irra taa’anii dubbachuun isin irraa hin eegamu ta’uu danda’a.</li><li><strong>Humna Gareetii (Leverage):</strong> Isin jalatti fakkeenyaaf hoostota 15 ykn 30 yoo jiraatan, tokkoon tokkoon isaanii guyyaatti tamsaasa kallattii mataa isaanii yeroo geggeessan, qabxiin komishinii hoosta hunda irraa argamu kallattiin galii eejansii keessanii ta’a.</li><li><strong>Guddina Sadarkaa (Agent Levels):</strong> Galiin torbanii eejansii keessanii waliigalaa yeroo guddatu, dhibbeentaan komishinii keessanis sadarkaa gadi aanaa irraa gara ol aanaatti guddata.</li></ul><strong style='color:#fbbf24'>3. Deggersi fi Tajaajilli Hoostotaaf Kennamu Maal Ta’uu Qaba?</strong><p style='margin:.4rem 0'>Eejantiin cimaan gareen isaa akka milkaa’u gochuudhaan galii mataa isaa dabaluuf hojiiwwan ijoo armaan gadii hoostota isaaf raawwata:</p><ul><li><strong>Qajeelfamaa fi Leenjii Kennuu:</strong> Miseensonni haaraan yeroo seenan akkamitti herrega isaanii akka mirkaneessan, suuraa piroofaayilii (Profile) fi Bio isaanii akkamitti hawwataa akka taasisan barsiisuu. Hojiiwwan guyyaa (Daily Tasks), itti fayyadama yeroo fi seera waltajjii ibsuu.</li><li><strong>Hordoffii fi Jajjabeessuu:</strong> Guyyaa guyyaan sa’aatii hojii hoostotaa hordofuu, galma (Target) isaanii akka dhaqqaban gargaaruu fi rakkoolee teeknikaa ykn appilikeeshinii isaan mudatan furuu.</li><li><strong>Haala Waltajjii Uumuu:</strong> Hoostonni haaraan yeroo live seenan seenuun jajjabeessuu, party room keessatti beeksisuu fi miseensota gareetii biroo wajjin dorgommii PK akka godhan mijeessuu.</li><li><strong>Deggersa Kaffaltii fi Baasii Maallaqaa:</strong> Hoostonni qabxii (Points) hojjetan rakkoo malee gara maallaqa qabatamaatti akka jijjiiranii baasan gargaaruu.</li></ul><strong style='color:#fbbf24'>4. Gabaabsuuf</strong><p style='margin:.4rem 0'>Eejantii ta’uun milkaa’ina namoota biroo gargaaruun galii mataa ofii dabaluudha. Hoostonni keessan yeroo guddatanii galii baay’ee argatan, galiin passive isin live osoo hin taa’in argattan hamma wal fakkaatuun guddata.</p>`),L("2. የኤጀንት ደረጃዎች (Agent Levels) እና የኮሚሽን ዕድገት","2. Sadarkaalee Eejantii (Agent Levels)",`<strong style='color:#fbbf24'>የኤጀንት ደረጃዎች እና የኮሚሽን ተመን ሰንጠረዥ</strong><p style='margin:.4rem 0'>የኤጀንሲ ደረጃ የሚወሰነው ቡድንዎ ባለፉት 30 ቀናት ባስመዘገበው አጠቃላይ የፖይንት ገቢ መጠን ነው፦</p><div style='overflow-x:auto;margin:.5rem 0'><table style='width:100%;border-collapse:collapse;font-size:.75rem'><tr><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>ደረጃ (Level)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>ባለፉት 30 ቀናት የተሰበሰበ ፖይንት</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>የቀጥታ ስርጭት ኮሚሽን (Live)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>የጽሑፍ መልእክት ኮሚሽን (Chat)</th></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>D</td><td style='border:1px solid #3f3f46;padding:.4rem'>0</td><td style='border:1px solid #3f3f46;padding:.4rem'>4%</td><td style='border:1px solid #3f3f46;padding:.4rem'>4%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>C</td><td style='border:1px solid #3f3f46;padding:.4rem'>2,000,000 (2M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>8%</td><td style='border:1px solid #3f3f46;padding:.4rem'>8%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>B</td><td style='border:1px solid #3f3f46;padding:.4rem'>10,000,000 (10M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>12%</td><td style='border:1px solid #3f3f46;padding:.4rem'>12%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>A</td><td style='border:1px solid #3f3f46;padding:.4rem'>50,000,000 (50M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>16%</td><td style='border:1px solid #3f3f46;padding:.4rem'>16%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>S</td><td style='border:1px solid #3f3f46;padding:.4rem'>150,000,000 (150M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>20%</td><td style='border:1px solid #3f3f46;padding:.4rem'>20%</td></tr></table></div><strong style='color:#fbbf24'>የኮሚሽን ገቢ እንዴት ይሰላል?</strong><p style='margin:.4rem 0'>የኤጀንሲ ገቢ ከሁለት ምንጮች ይሰበሰባል፦</p><ul><li><strong>ከቀጥታ ሆስቶችዎ የሚገኝ ኮሚሽን (Host-related)፦</strong> የኤጀንሲዎ የኮሚሽን ፐርሰንት × ሆስቶችዎ የሠሩት አጠቃላይ ውጤት። ምሳሌ፦ የደረጃ C ኤጀንት ከሆኑ (8%)፣ ሆስቶችዎ ካስመዘገቡት የLive እና የChat ገቢ ላይ 8% ኮሚሽን ያገኛሉ።</li><li><strong>ከጋበዟቸው ንዑስ-ኤጀንቶች የሚገኝ ኮሚሽን (Invited Agent-related)፦</strong> (የእርስዎ የኮሚሽን ተመን − የጋበዙት ኤጀንት የኮሚሽን ተመን) × በዚያ ኤጀንት ስር ያሉ ሆስቶች ያገኙት አጠቃላይ ገቢ። ምሳሌ፦ እርስዎ ደረጃ B (12%) ከሆኑ እና የጋበዙት ኤጀንት ደረጃ D (4%) ከሆነ፣ በሁለቱ መካከል ባለው ልዩነት (12% − 4% = 8%) መሰረት ከእነርሱ ቡድን ገቢ ላይ 8% ኮሚሽን ይሰላላችኋል።</li></ul><strong style='color:#fbbf24'>ወሳኝ ሕጎች እና ማስታወሻዎች</strong><ul><li><strong>የ30 ቀናት ድምር፦</strong> የኤጀንት ደረጃ በየጊዜው የሚለዋወጠው (ይጨምራል ወይም ይቀንሳል) ባለፉት 30 ቀናት ውስጥ በተሰበሰበው አጠቃላይ የቡድን ገቢ መሠረት ነው።</li><li><strong>የሚካተቱ እና የማይካተቱ ገቢዎች፦</strong> ለኮሚሽን ስሌት የሚካተቱት ሆስቶች ከስጦታዎች (Gifts) እና ከጽሑፍ መልእክቶች (Text Chats) የሚያገኟቸው ገቢዎች ብቻ ናቸው። ከመድረኩ የሚሰጡ የቀን ተግባር ጉርሻዎች (Task Bonuses) እና የደረጃ ማበረታቻዎች (Ranking Bonuses) በኤጀንሲ ኮሚሽን ስሌት ውስጥ አይካተቱም።</li><li><strong>ፈጣን ገቢ መሆን (Real-Time Credit)፦</strong> የተሰላው ኮሚሽን በቀጥታና በቅጽበት ወደ ኤጀንሲው የፖይንት አካውንት ገቢ ይደረጋል።</li><li><strong>የእንቅስቃሴ ማጣት ማስጠንቀቂያ (Inactivity/Ban)፦</strong> አንድ ኤጀንት ለ7 ቀናት ወይም ከዚያ በላይ ምንም ዓይነት እንቅስቃሴ ካላደረገ (Inactive ከሆነ)፣ ወይም አካውንቱ ከታገደ (Banned ከተደረገ)፣ የኮሚሽን ክፍያው አይሰላለትም (ይቋረጣል)።</li></ul>`,`<strong style='color:#fbbf24'>Gabatee Sadarkaalee Eejantii fi Dhibbeentaa Komishinii</strong><p style='margin:.4rem 0'>Sadarkaan eejansii baay’ina galii qabxii waliigalaa gareen keessan guyyoota 30 darban keessatti galmeesse irratti murtaa’a:</p><div style='overflow-x:auto;margin:.5rem 0'><table style='width:100%;border-collapse:collapse;font-size:.75rem'><tr><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Sadarkaa (Level)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Qabxii guyyoota 30 darban walitti qabame</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Komishinii Tamsaasa Kallattii (Live)</th><th style='border:1px solid #3f3f46;padding:.4rem;color:#fbbf24;text-align:left'>Komishinii Ergaa Barreeffamaa (Chat)</th></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>D</td><td style='border:1px solid #3f3f46;padding:.4rem'>0</td><td style='border:1px solid #3f3f46;padding:.4rem'>4%</td><td style='border:1px solid #3f3f46;padding:.4rem'>4%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>C</td><td style='border:1px solid #3f3f46;padding:.4rem'>2,000,000 (2M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>8%</td><td style='border:1px solid #3f3f46;padding:.4rem'>8%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>B</td><td style='border:1px solid #3f3f46;padding:.4rem'>10,000,000 (10M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>12%</td><td style='border:1px solid #3f3f46;padding:.4rem'>12%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>A</td><td style='border:1px solid #3f3f46;padding:.4rem'>50,000,000 (50M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>16%</td><td style='border:1px solid #3f3f46;padding:.4rem'>16%</td></tr><tr><td style='border:1px solid #3f3f46;padding:.4rem;font-weight:800;color:#fcd34d'>S</td><td style='border:1px solid #3f3f46;padding:.4rem'>150,000,000 (150M)</td><td style='border:1px solid #3f3f46;padding:.4rem'>20%</td><td style='border:1px solid #3f3f46;padding:.4rem'>20%</td></tr></table></div><strong style='color:#fbbf24'>Komishiniin Akkamitti Herregama?</strong><p style='margin:.4rem 0'>Galiin eejansii maddoota lamaan walitti qabama:</p><ul><li><strong>Komishinii hoostota kallattii keessan irraa (Host-related):</strong> Dhibbeentaa komishinii eejansii keessan × bu’aa waliigalaa hoostonni keessan hojjetan. Fakkeenya: Eejantii Sadarkaa C (8%) yoo ta’ihan, galii Live fi Chat hoostonni keessan galmeessan irraa komishinii 8% argattu.</li><li><strong>Komishinii eejantota affeertan irraa (Invited Agent-related):</strong> (Dhibbeentaa komishinii keessan − dhibbeentaa komishinii eejantii isin affeertan) × galii waliigalaa hoostonni eejantii sanaa jalatti argatan. Fakkeenya: Isin Sadarkaa B (12%) yoo taatanii fi eejantiin affeertan Sadarkaa D (4%) yoo ta’e, garaagarummaa isaan lamaan jidduu jiruun (12% − 4% = 8%) galii gareewwan isaanii irraa komishinii 8% isiniif herregama.</li></ul><strong style='color:#fbbf24'>Seerotaa fi Yaadannoowwan Murteessoo</strong><ul><li><strong>Walitti qabama Guyyoota 30:</strong> Sadarkaan eejantii yeroo yeroon jijjiirama (ni dabala ykn ni hir’ata); kunis galii gareewwanii waliigalaa guyyoota 30 darban keessatti walitti qabame irratti hundaa’a.</li><li><strong>Galiiwwan Kan Ramadaman fi Kan Hin Ramadamne:</strong> Herrega komishiniitiif galiiwwan hoostonni kennaa (Gifts) fi ergaa barreeffamaa (Text Chats) irraa argatan qofa ramadamu. Boonasiin hojii guyyaa (Task Bonuses) fi jajjabeessaan sadarkaa (Ranking Bonuses) waltajjii irraa kennaman herrega komishinii eejansii keessatti hin ramadaman.</li><li><strong>Galii Yeruma (Real-Time Credit):</strong> Komishiniin herregame kallattiin fi yeruma akkaawuntii qabxii eejansii keessa galla’a.</li><li><strong>Akeekkachiisa Sochii Dhabuu (Inactivity/Ban):</strong> Eejantiin tokko guyyoota 7 ykn isaa ol sochii kamiyyuu yoo hin goone (Inactive yoo ta’e), ykn akkaawuntiin isaa yoo cufame (Banned yoo ta’e), kaffaltiin komishinii isaaf hin herregamu (ni addaan citaa).</li></ul>`)]}
];
